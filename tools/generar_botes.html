<!doctype html><html><body><script src="../js/iconos.js"></script><script src="../js/datos.js"></script><script src="../js/paneles.js"></script>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js"}}</script>
<script type="module">
/* Genera models/bote_{rec,nor,org}.gltf (embebido). Correr con tools/generar.py */
import * as THREE from 'three';
import {GLTFExporter} from 'https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/exporters/GLTFExporter.js';
const R=0.2,H=0.52;
function img(src){return new Promise(r=>{const i=new Image();i.onload=()=>r(i);i.src=src;});}
function rr(c,x,y,w,h,r){c.beginPath();c.roundRect(x,y,w,h,r);}
async function banda(cat){const i=await img(PANELES[cat.id]);const t=new THREE.Texture(i);t.needsUpdate=true;t.colorSpace=THREE.SRGBColorSpace;t.anisotropy=8;t.userData.mimeType='image/jpeg';return t;}
function lathe(pts,seg=64){return new THREE.LatheGeometry(pts.map(p=>new THREE.Vector2(p[0],p[1])),seg);}
async function bote(cat){const g=new THREE.Group();g.name='Bote_'+cat.id;
 const col=new THREE.Color(cat.color);
 const mat=new THREE.MeshPhysicalMaterial({name:'Cuerpo',color:col,roughness:.32,metalness:0,clearcoat:1,clearcoatRoughness:.15});
 const oscuro=new THREE.MeshPhysicalMaterial({name:'Base',color:col.clone().multiplyScalar(.45),roughness:.5,clearcoat:.6});
 const interior=new THREE.MeshStandardMaterial({name:'Interior',color:'#1d1d22',roughness:.9,side:THREE.BackSide});
 // cuerpo: perfil redondeado, ligeramente cónico
 const p=[[0,0.02],[R*.78,0.02],[R*.86,0.03],[R*.9,0.06]];for(let i=0;i<=10;i++){const y=0.06+i*(H-0.12)/10;p.push([R*(.9+.1*i/10),y]);}
 p.push([R*1.02,H-0.03],[R*1.03,H]);const cuerpo=new THREE.Mesh(lathe(p),mat);cuerpo.name='Cuerpo';g.add(cuerpo);
 const inn=new THREE.Mesh(new THREE.CylinderGeometry(R*.99,R*.85,H-0.06,48,1,true),interior);inn.position.y=H/2+0.03;inn.name='Interior';g.add(inn);
 const pie=new THREE.Mesh(new THREE.TorusGeometry(R*.86,0.022,16,64),oscuro);pie.rotation.x=Math.PI/2;pie.position.y=0.025;pie.name='Pie';g.add(pie);
 const borde=new THREE.Mesh(new THREE.TorusGeometry(R*1.04,0.018,16,64),oscuro);borde.rotation.x=Math.PI/2;borde.position.y=H;borde.name='Borde';g.add(borde);
 // banda frontal con etiqueta PROSEREM
 const tb=await banda(cat);const yb=H*0.5;
 const rB=R*(.9+.1*((yb-0.06)/(H-0.12)))+0.004;
 const th=0.38/rB;const bm=new THREE.Mesh(new THREE.CylinderGeometry(rB+0.006,rB-0.008,0.34,48,1,true,-th/2,th),new THREE.MeshPhysicalMaterial({name:'Etiqueta',map:tb,roughness:.25,clearcoat:1}));
 bm.position.y=yb;bm.name='Etiqueta';g.add(bm);
 // tapa con bisagra atrás (nodo "Tapa", origen = bisagra)
 const tapa=new THREE.Group();tapa.name='Tapa';tapa.position.set(0,H+0.005,-R*1.03);g.add(tapa);
 const dp=[[0,0.07]];for(let i=0;i<=12;i++){const a=i/12*Math.PI/2;dp.push([Math.sin(a)*R*1.06,0.07*Math.cos(a)*0.9+0.0]);}dp.push([R*1.08,0.0],[R*1.08,-0.012],[0,-0.012]);
 const domo=new THREE.Mesh(lathe(dp.reverse().map(q=>q)),mat);domo.position.z=R*1.03;domo.name='Domo';tapa.add(domo);
 const asa=new THREE.Mesh(new THREE.TorusGeometry(0.05,0.013,12,32,Math.PI),oscuro);asa.position.set(0,0.07,R*1.03+0.08);asa.name='Asa';tapa.add(asa);
 const ab=new THREE.Mesh(new THREE.TorusGeometry(0.05,0.013,12,32,Math.PI),oscuro);ab.rotation.y=0;asa.rotation.x=-0.3;
 return g;}
const ex=new GLTFExporter();window.salida={};
for(const cat of PROSEREM.cats){const g=await bote(cat);window.salida[cat.id]=JSON.stringify(await ex.parseAsync(g,{binary:false,embedImages:true}));}
window.listo=true;
</script></body></html>
